<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F3E5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F5E9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="320" rx="20" fill="url(#bg)" />

  <!-- 笑脸 SVG -->
  <circle cx="400" cy="70" r="35" fill="#AED6F1" opacity="0.85" />
  <circle cx="385" cy="60" r="4" fill="#5D6D7E" />
  <circle cx="415" cy="60" r="4" fill="#5D6D7E" />
  <path d="M 385 80 Q 400 95 415 80" stroke="#5D6D7E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="400" y1="35" x2="400" y2="22" stroke="#F9E79F" stroke-width="3" stroke-linecap="round"/>
  <line x1="435" y1="45" x2="425" y2="38" stroke="#F9E79F" stroke-width="3" stroke-linecap="round"/>
  <line x1="365" y1="45" x2="375" y2="38" stroke="#F9E79F" stroke-width="3" stroke-linecap="round"/>

  <!-- 名字 -->
  <text x="400" y="140" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#5D6D7E">Evelyn (XX)</text>

  <!-- 副标题 -->
  <text x="400" y="175" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#5499C7" font-weight="500">Growth Ops / Product Ops / GTM</text>

  <!-- 主张 -->
  <text x="400" y="225" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#34495E" font-style="italic">“努力去做更多</text>
  <text x="400" y="252" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#34495E">温暖且有力量的事情”</text>
  <text x="400" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#7F8C8D" font-style="italic">Striving to create warmth and impact.</text>

  <!-- 底部小字主张2 -->
  <text x="400" y="310" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#85929E">“谢谢你的存在，这世上有人想清楚地看见你。”  ·  Thank you for being here.</text>
</svg>
