<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD"/>
      <stop offset="50%" style="stop-color:#F3E5F5"/>
      <stop offset="100%" style="stop-color:#E8F5E9"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8E44AD"/>
      <stop offset="100%" style="stop-color:#5499C7"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="200" fill="url(#bg)" rx="16"/>

  <!-- 装饰圆圈 -->
  <circle cx="820" cy="40" r="60" fill="#AED6F1" opacity="0.25"/>
  <circle cx="80" cy="170" r="45" fill="#D7BDE2" opacity="0.25"/>
  <circle cx="450" cy="190" r="30" fill="#A9DFBF" opacity="0.2"/>

  <!-- 阳光射线 -->
  <line x1="820" y1="40" x2="820" y2="15" stroke="#F9E79F" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="845" y1="55" x2="862" y2="45" stroke="#F9E79F" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="795" y1="55" x2="778" y2="45" stroke="#F9E79F" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 笑脸 -->
  <circle cx="820" cy="40" r="18" fill="#AED6F1" opacity="0.9"/>
  <circle cx="814" cy="36" r="2.5" fill="#5D6D7E"/>
  <circle cx="826" cy="36" r="2.5" fill="#5D6D7E"/>
  <path d="M 812 46 Q 820 52 828 46" stroke="#5D6D7E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 名字 -->
  <text x="450" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="url(#titleGrad)" letter-spacing="2">Evelyn</text>

  <!-- 副标题 -->
  <text x="450" y="115" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#5499C7" letter-spacing="3">Growth Ops · Product Ops · GTM</text>

  <!-- 分隔线 -->
  <line x1="310" y1="128" x2="590" y2="128" stroke="#D2B4DE" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- 底部引言 -->
  <text x="450" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7F8C8D" font-style="italic">✦  Striving to create warmth and impact  ✦</text>

  <!-- 中文引言 -->
  <text x="450" y="182" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#AF7AC5" opacity="0.85">努力去做更多温暖且有力量的事情</text>
</svg>
